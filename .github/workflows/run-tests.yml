name: Playwright login test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Vercel URL to test (e.g. https://your-app.vercel.app)"
        required: true
        type: string

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Ensure data directory
        run: mkdir -p .data

      - name: Run login test
        run: npx playwright test tests/login.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            .data/playwright-report.json
          retention-days: 7
